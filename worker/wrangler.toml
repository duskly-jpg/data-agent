name = "data-agent-demo"
main = "index.js"
compatibility_date = "2025-01-01"

# D1：先 `wrangler d1 create data-agent-db`，把返回的 database_id 填进来
[[d1_databases]]
binding = "DB"
database_name = "data-agent-db"
database_id = "86a62da4-808b-4199-9e5d-dd8935931cac"

# R2：原始层落地物（gen_data.py 导出的 3 个 CSV）放这里，Demo 不直接读，仅作数据血缘证据
[[r2_buckets]]
binding = "R2"
bucket_name = "data-agent-raw"

# Workers AI：Text-to-SQL 模型；未配置时 Worker 自动回退语义层路由，Demo 仍可用
[ai]
binding = "AI"

[vars]
ANCHOR_DATE = "2026-11-12"
LLM_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# 凭证绝不写进本文件：wrangler secret put LLM_TOKEN
# 本地开发用 .dev.vars（加入 .gitignore），同样不入库
